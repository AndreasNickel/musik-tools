<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musik-Tools</title>
<style>
  :root { --bg: #f7f5f0; --ink: #1f1d1a; --muted: #77716a; --line: #d9d3c8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161513; --ink: #ece7df; --muted: #9a938a; --line: #36322d; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  a { color: inherit; display: flex; gap: 14px; align-items: center; padding: 12px; border: 1px solid var(--line);
      border-radius: 12px; text-decoration: none; margin-bottom: 10px; }
  img { width: 56px; height: 56px; border-radius: 12px; }
  small { color: var(--muted); display: block; }
</style>
</head>
<body>
<main>
  <h1>Musik-Tools</h1>
  <a href="pentatonik/"><img src="pentatonik/icons/icon-192.png" alt="">
    <span><strong>Skalen &amp; Akkorde – Griffbrett</strong>
      <small>Pentatonik-Positionen, Skalen und Akkorde auf dem Gitarrengriffbrett</small></span></a>
</main>
</body>
</html>
